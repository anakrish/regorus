# Separate aya workspace for the Rust-eBPF backends. Two kernel programs
# (`ebpf` = cgroup/connect4 egress, `lsm-ebpf` = lsm/file_open access), each
# built for `bpfel-unknown-none` under nightly, plus their user-space loaders.
# Excluded from the parent x86_64 regorus workspace because the ebpf members
# cannot be compiled for the host target. `default-members` keeps a plain
# `cargo build`/`cargo test` here restricted to the loaders; the ebpf crates are
# compiled separately by each loader's `build.rs` via `aya-build`.
[workspace]
resolver = "2"
members = ["ebpf", "loader", "lsm-ebpf", "lsm-loader"]
default-members = ["loader", "lsm-loader"]

# Profiles must live at the workspace root. The ebpf crate is built `--release`
# by aya-build; `panic = "abort"` + fat LTO + single codegen unit keep the BPF
# object small and verifier-friendly.
[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
