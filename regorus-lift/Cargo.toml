[package]
name = "regorus-lift"
description = "Lift the kernel-enforceable subset of a Regorus policy into a fixed enforcement config"
version = "0.0.0"
edition = "2021"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
repository = "https://github.com/microsoft/regorus"
publish = false

[lib]
doctest = false

[dependencies]
regorus = { path = "..", default-features = false, features = ["std", "arc", "rvm", "explanations", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
