# Loops and Quantifiers Test Suite
# Tests basic loop constructs, quantifiers (some/every), and comprehensions

cases:
  - note: basic_variable_test
    data: {}
    modules:
      - |
        package test
        main := result if {
          x := 5
          result := x > 2
        }
    query: data.test.main
    want_result: true

  - note: basic_some_test
    data: {}
    modules:
      - |
        package test
        main := result if {
          some x in [1, 2, 3]
          x > 2
          result := x
        }
    query: data.test.main
    want_result: 3

  - note: basic_every_test
    data: {}
    modules:
      - |
        package test
        main := result if {
          every x in [1, 2, 3] {
            x > 0
          }
          result := true
        }
    query: data.test.main
    want_result: true

  - note: every_failure_prevents_assignment
    data: {}
    modules:
      - |
        package test
        main := 5 if {
          every x in [1, 2, 3] {
            x > 10
          }
        }
    query: data.test.main
    want_result: "#undefined"

  - note: every_undefined_domain_fails
    modules:
      - |
        package test
        main := true if {
          every c in input.containers {
            c > 0
          }
        }
    query: data.test.main
    want_result: "#undefined"

  - note: every_some_failure_propagates
    data: {}
    input:
      users:
        - roles: ["reader"]
        - roles: ["admin"]
    modules:
      - |
        package test
        main := true if {
          every user in input.users {
            some role in user.roles
            role == "admin"
          }
        }
    query: data.test.main
    want_result: "#undefined"

  - note: some_in_loop_without_match_is_undefined
    data: {}
    modules:
      - |
        package test
        main := true if {
          some role in ["reader", "writer"]
          role == "admin"
        }
    query: data.test.main
    want_result: "#undefined"

  - note: simple_loop_test
    data: {}
    modules:
      - |
        package test
        main := result if {
          x := 1
          y := 2
          result := x * y
        }
    query: data.test.main
    want_result: 2

  - note: loop_array_comprehension
    data: {}
    modules:
      - |
        package test
        main := [(x * 2) | x := [1, 2, 3][_]]
    query: data.test.main
    want_result: [2, 4, 6]

  - note: loop_set_comprehension
    data: {}
    modules:
      - |
        package test
        main := {(x * 2) | x := [1, 2, 3][_]}
    query: data.test.main
    want_result:
      set!: [2, 4, 6]

  - note: loop_object_comprehension
    data: {}
    modules:
      - |
        package test
        main := {k: (v * 2) | v := {"a": 1, "b": 2, "c": 3}[k]}
    query: data.test.main
    want_result:
      a: 2
      b: 4
      c: 6
